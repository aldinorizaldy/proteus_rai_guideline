# PROTEUS Responsible AI Guideline – MkDocs configuration
# Placeholder to replace: the project URL (extra.project_url).

site_name: PROTEUS Responsible AI Guideline
site_description: >-
  Responsible AI guideline of the Horizon Europe project PROTEUS – The Copernicus
  Agent for Next-Generation Environmental Intelligence (GA No. 101296397).
site_author: Helmholtz-Zentrum Dresden-Rossendorf (HZDR)
site_url: https://aldinorizaldy.github.io/proteus_rai_guideline/
repo_url: https://github.com/aldinorizaldy/proteus_rai_guideline
repo_name: proteus_rai_guideline
edit_uri: edit/main/docs/
copyright: >-
  Text © PROTEUS consortium, licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/proteus-wordmark-white.png
  favicon: assets/favicon-32.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  icon:
    edit: material/pencil-outline
    repo: fontawesome/brands/github
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer          # previous / next links
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit        # "Edit this page on GitHub"
    - content.code.copy
    - content.tooltips

extra:
  # Bump these with `python scripts/bump_version.py X.Y YYYY-MM-DD`.
  version: "0.1"
  release_date: "2026-11-02"
  doi: "10.5281/zenodo.XXXXXXX"
  pdf: pdf/proteus-rai-guideline.pdf
  project_url: https://www.proteus-project.eu   # placeholder
  grant: "101296397"
  deliverable: D1.3
  rai_contact: rai-reviewer@example.org (placeholder)   # placeholder: set the real address
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aldinorizaldy/proteus_rai_guideline
      name: Source on GitHub
    - icon: material/web
      link: https://www.proteus-project.eu
      name: PROTEUS project website

extra_css:
  - stylesheets/extra.css
  - stylesheets/tools.css
extra_javascript:
  - javascripts/extra.js
  - javascripts/tools.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: "#"
      permalink_title: Copy link to this section
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret        # ^superscript^ (pandoc output)
  - pymdownx.tilde        # ~subscript~ and ~~strikethrough~~
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets:
      base_path: [".", "includes"]
      check_paths: true
      auto_append: [links.md]

plugins:
  - search
  # GDPR: the Google Fonts above are fetched from Google's servers on every
  # visit. To self-host them (and other external assets) instead, enable:
  # - privacy
  - print-site:            # must stay the last plugin
      add_to_navigation: false
      add_print_site_banner: false
      add_cover_page: true
      cover_page_template: includes/print_cover.tpl
      add_table_of_contents: true
      toc_title: Contents
      toc_depth: 2
      add_full_urls: false
      enumerate_headings: false
      print_page_title: PROTEUS Responsible AI Guideline
      exclude:              # the PDF is the guideline only
        - index.md
        - at-a-glance.md
        - tools/*
        - changelog.md
        - contribute.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: warn

nav:
  - Home: index.md
  - At a glance: at-a-glance.md
  - Guideline:
      - guideline/index.md
      # BEGIN guideline-nav (managed by scripts/build_from_docx.py)
      - "1. Executive Summary": guideline/01-executive-summary.md
      - "2. Introduction": guideline/02-introduction.md
      - "3. Responsible AI Principles": guideline/03-responsible-ai-principles.md
      - "4. Foundation Model Risks": guideline/04-foundation-model-risks.md
      - "5. Regulatory Landscape": guideline/05-regulatory-landscape.md
      - "6. Data and Intellectual Property": guideline/06-data-and-intellectual-property.md
      - "7. Requirements by Lifecycle Stage": guideline/07-requirements-by-lifecycle-stage.md
      - "8. Responsible AI Strategies": guideline/08-responsible-ai-strategies.md
      - "9. Responsible AI Metadata Schema": guideline/09-responsible-ai-metadata-schema.md
      - "10. Compliance Assessment Process": guideline/10-compliance-assessment-process.md
      - "11. Automated Validation": guideline/11-automated-validation.md
      - "12. Governance and Monitoring": guideline/12-governance-and-monitoring.md
      - "Annex A: Requirements Checklist": guideline/13-annex-a-requirements-checklist.md
      - "Annex B: Compliance Card and JSON Schema": guideline/14-annex-b-compliance-card-and-json-schema.md
      - "Annex C: Standards Crosswalk": guideline/15-annex-c-standards-crosswalk.md
      - "Annex D: Glossary": guideline/16-annex-d-glossary.md
      - "Annex E: Worked Example": guideline/17-annex-e-worked-example.md
      - "Annex F: PROTEUS Roles and Partner Mapping": guideline/18-annex-f-proteus-roles-and-partner-mapping.md
      - "Annex G: Use-Case Examples (UC1 to UC7)": guideline/19-annex-g-use-case-examples-uc1-to-uc7.md
      - "Annex H: PROTEUS Risk-Tier Examples": guideline/20-annex-h-proteus-risk-tier-examples.md
      - "Annex I: PROTEUS Project Context and Commitments": guideline/21-annex-i-proteus-project-context-and-commitments.md
      - "Annex J: Automated Validation in PROTEUS": guideline/22-annex-j-automated-validation-in-proteus.md
      - "Annex K: Relationship to the PROTEUS Data Management Plan": guideline/23-annex-k-relationship-to-the-proteus-data.md
      - "Annex L: PROTEUS Roadmap to D2.2": guideline/24-annex-l-proteus-roadmap-to-d2-2.md
      # END guideline-nav
  - Quick tools:
      - tools/index.md
      - Start here: tools/start-here.md
      - Use cases:
          - tools/use-cases/index.md
          # BEGIN usecase-nav (managed by scripts/build_from_docx.py)
          - "UC1 · Displacement monitoring": tools/use-cases/uc1.md
          - "UC2 · Crop stress": tools/use-cases/uc2.md
          - "UC3 · Irrigation": tools/use-cases/uc3.md
          - "UC4 · Urban air quality": tools/use-cases/uc4.md
          - "UC5 · Wildfires": tools/use-cases/uc5.md
          - "UC6 · Flood risk": tools/use-cases/uc6.md
          - "UC7 · Research and education": tools/use-cases/uc7.md
          # END usecase-nav
      - Requirements checklist: tools/checklist.md
      - Risk-tier self-check: tools/risk-check.md
      - Compliance card: tools/compliance-card.md
      - Worked example: tools/worked-example.md
  - How to cite: cite.md
  - Changelog: changelog.md
  - Contribute: contribute.md
