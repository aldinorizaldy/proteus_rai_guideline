name: Build and deploy site

on:
  push:
    branches: [main]
  pull_request:          # build-only check for PRs (no deploy)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for PDF export
        run: python -m playwright install --with-deps chromium

      - name: Prepare brand assets (favicons, transparent logo, hero image)
        run: python scripts/prepare_assets.py

      - name: Build pages and tool data from the docx
        run: python scripts/build_from_docx.py

      - name: Check the Guideline tab matches the docx
        run: python scripts/check_guideline.py

      - name: Test the docx pipeline on the sample guideline
        run: python -m unittest discover -s tests -v

      - name: Build site (strict)
        run: mkdocs build --strict

      - name: Build PDF
        run: |
          VERSION=$(python -c "import yaml,sys; c=yaml.load(open('mkdocs.yml'), Loader=yaml.BaseLoader); print(f\"Version {c['extra']['version']} – {c['extra']['release_date']}\")")
          python scripts/build_pdf.py --label "$VERSION"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
